name: "upflow-teste"
version: "3.7"

services:
  app:
    depends_on:
      - db
    build:
      args:
        user: upflow
        uid: 1000
      context: ./
      dockerfile: .docker/php8.4-fpm.dockerfile
    image: upflow/app
    container_name: upflow-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    command:
      sh -c "[ ! -f .env ] && cp .env.example .env || echo '.env já existe' \
        && composer install --ignore-platform-reqs \
        && php artisan key:generate \
        && npm install \
        && npm run build \
        && php artisan migrate --force \
        && php artisan db:seed --force \
        && docker-php-entrypoint php-fpm"
    networks:
      - upflow
  db:
    image: postgres:15
    container_name: upflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: postgres
    ports:
      - 5499:5432
    volumes:
      - .docker/postgres:/docker-entrypoint-initdb.d
    networks:
      - upflow
  nginx:
    image: nginx:1.17-alpine
    container_name: upflow-nginx
    restart: unless-stopped
    ports:
      - 8099:80
    volumes:
      - ./:/var/www
      - .docker/nginx:/etc/nginx/conf.d
    networks:
      - upflow

networks:
  upflow:
    driver: bridge
    external: false